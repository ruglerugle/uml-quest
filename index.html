<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UML Quest — UMLを制する者が、設計を制す</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', monospace;
    background: #0a0e1a;
    color: #e0e6ff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 {
    font-size: 1.5rem;
    color: #7ec8e3;
    letter-spacing: 4px;
    margin-bottom: 4px;
    text-transform: uppercase;
  }
  .subtitle { color: #556; font-size: 0.75rem; margin-bottom: 16px; letter-spacing: 2px; }

  .hud {
    display: flex; gap: 24px; margin-bottom: 16px;
    background: #111827; border: 1px solid #1e3a5f;
    padding: 8px 20px; border-radius: 6px;
  }
  .hud-item { text-align: center; }
  .hud-label { font-size: 0.6rem; color: #556; letter-spacing: 1px; text-transform: uppercase; }
  .hud-value { font-size: 1.2rem; color: #7ec8e3; font-weight: bold; }

  .stage {
    width: 100%; max-width: 760px;
    background: #111827;
    border: 1px solid #1e3a5f;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 12px;
    min-height: 340px;
    position: relative;
  }
  .stage-label {
    font-size: 0.65rem; color: #556; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 12px;
  }
  .question-text {
    font-size: 1rem; color: #c9d6ff;
    line-height: 1.6; margin-bottom: 16px;
    white-space: pre-line;
  }

  .uml-area {
    background: #0d1626;
    border: 1px solid #1e3a5f;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: auto;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  @media (max-width: 500px) { .choices { grid-template-columns: 1fr; } }

  .choice-btn {
    background: #0d1626;
    border: 1px solid #1e3a5f;
    color: #c9d6ff;
    padding: 10px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    transition: all 0.15s;
    text-align: left;
  }
  .choice-btn:hover:not(:disabled) { border-color: #7ec8e3; color: #7ec8e3; background: #0f1f33; }
  .choice-btn.correct { border-color: #4ade80; color: #4ade80; background: #0a1f14; }
  .choice-btn.wrong   { border-color: #f87171; color: #f87171; background: #1f0a0a; }
  .choice-btn:disabled { cursor: not-allowed; opacity: 0.7; }

  .feedback {
    display: none;
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    line-height: 1.6;
  }
  .feedback.show { display: block; }
  .feedback.ok  { background: #0a1f14; border: 1px solid #4ade80; color: #4ade80; }
  .feedback.ng  { background: #1f0a0a; border: 1px solid #f87171; color: #f87171; }

  .next-btn {
    display: none;
    margin-top: 12px;
    background: #7ec8e3;
    color: #0a0e1a;
    border: none;
    padding: 10px 28px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .next-btn.show { display: block; }
  .next-btn:hover { background: #a8dcf0; }

  .progress-bar {
    width: 100%; max-width: 760px;
    height: 4px;
    background: #1e3a5f;
    border-radius: 2px;
    margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #7ec8e3, #4ade80);
    border-radius: 2px;
    transition: width 0.4s;
  }

  .result-screen {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }
  .result-screen.show { display: block; }
  .result-title { font-size: 2rem; color: #7ec8e3; margin-bottom: 8px; }
  .result-score { font-size: 3rem; color: #4ade80; font-weight: bold; margin-bottom: 16px; }
  .result-msg { color: #c9d6ff; margin-bottom: 24px; line-height: 1.8; }
  .restart-btn {
    background: #7ec8e3; color: #0a0e1a;
    border: none; padding: 12px 32px;
    border-radius: 6px; cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 1rem; font-weight: bold;
  }
  .restart-btn:hover { background: #a8dcf0; }

  .rank { font-size: 1.5rem; margin-bottom: 8px; }

  .cat-badge {
    display: inline-block;
    font-size: 0.6rem;
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
    border: 1px solid;
  }
  .cat-class    { color: #7ec8e3; border-color: #7ec8e3; }
  .cat-seq      { color: #a78bfa; border-color: #a78bfa; }
  .cat-rel      { color: #fb923c; border-color: #fb923c; }
  .cat-diagram  { color: #4ade80; border-color: #4ade80; }

  .streak { color: #fb923c; font-size: 0.7rem; }
</style>
</head>
<body>

<h1>⬡ UML Quest</h1>
<div class="subtitle">UMLを制する者が、設計を制す</div>

<div class="hud">
  <div class="hud-item">
    <div class="hud-label">Score</div>
    <div class="hud-value" id="score">0</div>
  </div>
  <div class="hud-item">
    <div class="hud-label">Question</div>
    <div class="hud-value" id="qnum">1/10</div>
  </div>
  <div class="hud-item">
    <div class="hud-label">Combo</div>
    <div class="hud-value streak" id="combo">×1</div>
  </div>
  <div class="hud-item">
    <div class="hud-label">Lives</div>
    <div class="hud-value" id="lives">♥ ♥ ♥</div>
  </div>
</div>

<div class="progress-bar">
  <div class="progress-fill" id="progress" style="width:0%"></div>
</div>

<div class="stage" id="stage">
  <div class="stage-label" id="stage-label">▶ Stage Loading...</div>
  <div id="cat-badge-area"></div>
  <div class="question-text" id="q-text"></div>
  <div class="uml-area" id="uml-area"></div>
  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="next-btn">NEXT →</button>

  <div class="result-screen" id="result">
    <div class="rank" id="result-rank"></div>
    <div class="result-title">GAME CLEAR!</div>
    <div class="result-score" id="result-score"></div>
    <div class="result-msg" id="result-msg"></div>
    <button class="restart-btn" onclick="restart()">▶ RESTART</button>
  </div>
</div>

<script>
// ─── SVG generators ────────────────────────────────────────────────────────

function svgClass(name, attrs, methods, color) {
  attrs = attrs || []; methods = methods || []; color = color || '#7ec8e3';
  var w = 180, rowH = 22, pad = 14;
  var attrH = attrs.length * rowH + (attrs.length ? 8 : 0);
  var methH = methods.length * rowH + (methods.length ? 8 : 0);
  var h = 36 + attrH + methH;
  var y = 36;
  var rows = '';
  if (attrs.length) {
    rows += '<line x1="0" y1="' + y + '" x2="' + w + '" y2="' + y + '" stroke="#1e3a5f" stroke-width="1"/>';
    attrs.forEach(function(a) {
      rows += '<text x="' + pad + '" y="' + (y + 16) + '" fill="#c9d6ff" font-size="11" font-family="Courier New">' + a + '</text>';
      y += rowH;
    });
    y += 8;
  }
  if (methods.length) {
    rows += '<line x1="0" y1="' + y + '" x2="' + w + '" y2="' + y + '" stroke="#1e3a5f" stroke-width="1"/>';
    methods.forEach(function(m) {
      rows += '<text x="' + pad + '" y="' + (y + 16) + '" fill="#a8dcf0" font-size="11" font-family="Courier New">' + m + '</text>';
      y += rowH;
    });
  }
  return '<svg width="' + w + '" height="' + h + '" xmlns="http://www.w3.org/2000/svg">'
    + '<rect width="' + w + '" height="' + h + '" rx="4" fill="#0d1626" stroke="' + color + '" stroke-width="1.5"/>'
    + '<rect width="' + w + '" height="36" rx="4" fill="#0f2040" stroke="none"/>'
    + '<rect y="32" width="' + w + '" height="4" fill="#0f2040"/>'
    + '<text x="' + (w/2) + '" y="22" fill="' + color + '" font-size="12" font-weight="bold" text-anchor="middle" font-family="Courier New">«class» ' + name + '</text>'
    + rows + '</svg>';
}

function svgSequence(actors, messages) {
  var W = 420, H = 50 + messages.length * 50 + 30;
  var colW = W / (actors.length + 1);
  var svg = '<svg width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg">'
    + '<defs><marker id="sarr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c9d6ff"/></marker></defs>';
  actors.forEach(function(a, i) {
    var x = colW * (i + 1);
    svg += '<rect x="' + (x-45) + '" y="8" width="90" height="28" rx="4" fill="#0f2040" stroke="#7ec8e3" stroke-width="1.5"/>';
    svg += '<text x="' + x + '" y="27" fill="#7ec8e3" font-size="12" font-weight="bold" text-anchor="middle" font-family="Courier New">' + a + '</text>';
    svg += '<line x1="' + x + '" y1="36" x2="' + x + '" y2="' + (H-10) + '" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4,3"/>';
  });
  messages.forEach(function(m, idx) {
    var y = 65 + idx * 50;
    var x1 = colW * (m.from + 1);
    var x2 = colW * (m.to + 1);
    var color = m.ret ? '#556' : '#c9d6ff';
    var dash = m.ret ? 'stroke-dasharray="5,3"' : '';
    svg += '<line x1="' + x1 + '" y1="' + y + '" x2="' + x2 + '" y2="' + y + '" stroke="' + color + '" stroke-width="1.5" ' + dash + ' marker-end="url(#sarr)"/>';
    var tx = (x1 + x2) / 2;
    svg += '<text x="' + tx + '" y="' + (y-6) + '" fill="' + color + '" font-size="10" text-anchor="middle" font-family="Courier New">' + m.label + '</text>';
    if (!m.ret) {
      svg += '<rect x="' + (x2-6) + '" y="' + y + '" width="12" height="34" fill="#1e3a5f" stroke="#7ec8e3" stroke-width="1" rx="2"/>';
    }
  });
  svg += '</svg>';
  return svg;
}

// ─── Questions ─────────────────────────────────────────────────────────────
var questions = [
  {
    cat: 'class', catLabel: 'クラス図',
    text: 'このUMLクラス図で、最上部のコンパートメント（区画）に表示されるのは何？',
    svg: svgClass('Person', ['-name: String', '-age: int'], ['+getName(): String', '+setAge(int): void']),
    choices: ['クラス名', '属性 (Attributes)', 'メソッド (Methods)', 'パッケージ名'],
    answer: 0,
    explain: '最上部のコンパートメントにはクラス名が入ります。2段目が属性、3段目がメソッドです。'
  },
  {
    cat: 'class', catLabel: 'クラス図',
    text: 'UMLクラス図で「- name: String」の先頭「-」は何を意味する？',
    svg: svgClass('User', ['-name: String', '+email: String', '#role: String'], ['+login(): void']),
    choices: ['public（公開）', 'private（非公開）', 'protected（保護）', 'static（静的）'],
    answer: 1,
    explain: '可視性修飾子：「-」= private、「+」= public、「#」= protected です。'
  },
  {
    cat: 'rel', catLabel: '関係',
    text: '実線 + 白抜き三角矢印はどの関係を表している？',
    svg: '<svg width="320" height="100" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="25" width="120" height="50" rx="4" fill="#0d1626" stroke="#7ec8e3" stroke-width="1.5"/><text x="70" y="55" fill="#7ec8e3" font-size="13" font-weight="bold" text-anchor="middle" font-family="Courier New">Animal</text><rect x="190" y="25" width="120" height="50" rx="4" fill="#0d1626" stroke="#4ade80" stroke-width="1.5"/><text x="250" y="55" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle" font-family="Courier New">Dog</text><line x1="190" y1="50" x2="147" y2="50" stroke="#ffffff" stroke-width="2"/><polygon points="147,50 157,44 157,56" fill="none" stroke="#ffffff" stroke-width="2"/><text x="160" y="90" fill="#556" font-size="10" text-anchor="middle" font-family="Courier New">Dog → Animal へ向かう矢印</text></svg>',
    choices: ['依存 (Dependency)', '集約 (Aggregation)', '継承 (Generalization)', '実現 (Realization)'],
    answer: 2,
    explain: '実線 + 白抜き三角矢印は「継承（汎化）」を表します。DogはAnimalを継承しています（is-a関係）。'
  },
  {
    cat: 'rel', catLabel: '関係',
    text: '破線 + 白抜き三角矢印は何を表す？',
    svg: '<svg width="340" height="110" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="10" width="130" height="80" rx="4" fill="#0d1626" stroke="#a78bfa" stroke-width="1.5"/><text x="75" y="32" fill="#a78bfa" font-size="10" text-anchor="middle" font-family="Courier New">«interface»</text><text x="75" y="50" fill="#a78bfa" font-size="13" font-weight="bold" text-anchor="middle" font-family="Courier New">Drawable</text><line x1="10" y1="56" x2="140" y2="56" stroke="#1e3a5f"/><text x="75" y="74" fill="#a8dcf0" font-size="10" font-family="Courier New">+draw(): void</text><rect x="200" y="28" width="130" height="50" rx="4" fill="#0d1626" stroke="#4ade80" stroke-width="1.5"/><text x="265" y="58" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle" font-family="Courier New">Circle</text><line x1="200" y1="53" x2="157" y2="53" stroke="#ffffff" stroke-width="2" stroke-dasharray="6,3"/><polygon points="157,53 167,47 167,59" fill="none" stroke="#ffffff" stroke-width="2"/></svg>',
    choices: ['継承 (Generalization)', '実現 (Realization)', '依存 (Dependency)', '合成 (Composition)'],
    answer: 1,
    explain: '破線 + 白抜き三角矢印は「実現（Realization）」。インターフェースの実装を表します。CircleはDrawableを実装しています。'
  },
  {
    cat: 'rel', catLabel: '関係',
    text: '塗りつぶしひし形（♦）付きの実線矢印は何を表す？',
    svg: '<svg width="340" height="90" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="20" width="120" height="50" rx="4" fill="#0d1626" stroke="#fb923c" stroke-width="1.5"/><text x="70" y="50" fill="#fb923c" font-size="13" font-weight="bold" text-anchor="middle" font-family="Courier New">House</text><rect x="210" y="20" width="120" height="50" rx="4" fill="#0d1626" stroke="#f87171" stroke-width="1.5"/><text x="270" y="50" fill="#f87171" font-size="13" font-weight="bold" text-anchor="middle" font-family="Courier New">Room</text><line x1="130" y1="45" x2="197" y2="45" stroke="#fb923c" stroke-width="2"/><polygon points="130,45 142,39 154,45 142,51" fill="#fb923c"/><line x1="197" y1="39" x2="210" y2="45" stroke="#fb923c" stroke-width="2"/><line x1="197" y1="51" x2="210" y2="45" stroke="#fb923c" stroke-width="2"/><text x="170" y="80" fill="#556" font-size="10" text-anchor="middle" font-family="Courier New">♦ 塗りつぶしひし形</text></svg>',
    choices: ['集約 (Aggregation)', '依存 (Dependency)', '合成 (Composition)', '継承 (Generalization)'],
    answer: 2,
    explain: '塗りつぶしひし形は「合成（Composition）」。部分が全体なしに存在できない強い所有関係。RoomはHouseなしに存在しません。'
  },
  {
    cat: 'rel', catLabel: '関係',
    text: '白抜きひし形（◇）付きの実線は何を表す？',
    svg: '<svg width="340" height="90" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="20" width="120" height="50" rx="4" fill="#0d1626" stroke="#7ec8e3" stroke-width="1.5"/><text x="70" y="50" fill="#7ec8e3" font-size="13" font-weight="bold" text-anchor="middle" font-family="Courier New">Team</text><rect x="210" y="20" width="120" height="50" rx="4" fill="#0d1626" stroke="#c9d6ff" stroke-width="1.5"/><text x="270" y="50" fill="#c9d6ff" font-size="13" font-weight="bold" text-anchor="middle" font-family="Courier New">Player</text><line x1="130" y1="45" x2="210" y2="45" stroke="#7ec8e3" stroke-width="2"/><polygon points="130,45 142,39 154,45 142,51" fill="none" stroke="#7ec8e3" stroke-width="2"/><text x="170" y="80" fill="#556" font-size="10" text-anchor="middle" font-family="Courier New">◇ 白抜きひし形</text></svg>',
    choices: ['合成 (Composition)', '集約 (Aggregation)', '実現 (Realization)', '依存 (Dependency)'],
    answer: 1,
    explain: '白抜きひし形は「集約（Aggregation）」。部分が全体なしに存在できる弱い所有関係。PlayerはTeamなしにも存在できます。'
  },
  {
    cat: 'seq', catLabel: 'シーケンス図',
    text: 'シーケンス図で「点線の矢印（破線）」が表すのは？',
    svg: svgSequence(['Client', 'Server'], [
      { from: 0, to: 1, label: 'request()', ret: false },
      { from: 1, to: 0, label: 'response()', ret: true }
    ]),
    choices: ['同期呼び出し', '非同期呼び出し', '戻り値・応答メッセージ', 'オブジェクト生成'],
    answer: 2,
    explain: 'シーケンス図の破線矢印は「戻り値・応答（return）」を表します。実線が呼び出し、破線が応答です。'
  },
  {
    cat: 'seq', catLabel: 'シーケンス図',
    text: 'シーケンス図の縦の破線（ライフライン）は何を表す？',
    svg: '<svg width="300" height="160" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="10" width="80" height="30" rx="4" fill="#0f2040" stroke="#7ec8e3" stroke-width="1.5"/><text x="70" y="30" fill="#7ec8e3" font-size="12" font-weight="bold" text-anchor="middle" font-family="Courier New">:User</text><line x1="70" y1="40" x2="70" y2="155" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4,3"/><rect x="190" y="10" width="80" height="30" rx="4" fill="#0f2040" stroke="#a78bfa" stroke-width="1.5"/><text x="230" y="30" fill="#a78bfa" font-size="12" font-weight="bold" text-anchor="middle" font-family="Courier New">:System</text><line x1="230" y1="40" x2="230" y2="155" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4,3"/><text x="150" y="105" fill="#fb923c" font-size="10" text-anchor="middle" font-family="Courier New">← この縦の破線は？ →</text></svg>',
    choices: ['アクティベーションボックス', 'ライフライン (Lifeline)', 'フラグメント境界', 'ガード条件'],
    answer: 1,
    explain: 'オブジェクトボックスから伸びる縦の破線が「ライフライン」。オブジェクトが存在している時間軸を表します。'
  },
  {
    cat: 'diagram', catLabel: 'ダイアグラム種別',
    text: 'ユーザーとシステムの「対話・やりとりの流れ」を時系列で表すUML図はどれ？',
    svg: svgSequence(['User', 'Auth'], [
      { from: 0, to: 1, label: 'login(id, pw)', ret: false },
      { from: 1, to: 0, label: ':token', ret: true }
    ]),
    choices: ['クラス図 (Class Diagram)', 'ユースケース図 (Use Case)', 'シーケンス図 (Sequence Diagram)', 'アクティビティ図 (Activity)'],
    answer: 2,
    explain: 'オブジェクト間のメッセージ交換を時系列で示すのが「シーケンス図」。ライフラインと矢印でやりとりを表現します。'
  },
  {
    cat: 'diagram', catLabel: 'ダイアグラム種別',
    text: '「システムに対してユーザーが何をできるか」を楕円と棒人間で表すUML図は？',
    svg: '<svg width="300" height="170" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="10" width="280" height="150" rx="8" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="6,3"/><text x="254" y="26" fill="#fb923c" font-size="10" font-family="Courier New">System</text><circle cx="50" cy="50" r="12" fill="none" stroke="#7ec8e3" stroke-width="1.5"/><line x1="50" y1="62" x2="50" y2="100" stroke="#7ec8e3" stroke-width="1.5"/><line x1="30" y1="78" x2="70" y2="78" stroke="#7ec8e3" stroke-width="1.5"/><line x1="50" y1="100" x2="35" y2="118" stroke="#7ec8e3" stroke-width="1.5"/><line x1="50" y1="100" x2="65" y2="118" stroke="#7ec8e3" stroke-width="1.5"/><text x="50" y="135" fill="#7ec8e3" font-size="10" text-anchor="middle" font-family="Courier New">User</text><ellipse cx="190" cy="55" rx="68" ry="20" fill="#0d1626" stroke="#a78bfa" stroke-width="1.5"/><text x="190" y="60" fill="#a78bfa" font-size="11" text-anchor="middle" font-family="Courier New">ログイン</text><ellipse cx="190" cy="115" rx="68" ry="20" fill="#0d1626" stroke="#a78bfa" stroke-width="1.5"/><text x="190" y="120" fill="#a78bfa" font-size="11" text-anchor="middle" font-family="Courier New">商品検索</text><line x1="68" y1="65" x2="120" y2="57" stroke="#c9d6ff" stroke-width="1"/><line x1="68" y1="80" x2="120" y2="112" stroke="#c9d6ff" stroke-width="1"/></svg>',
    choices: ['シーケンス図', 'ユースケース図 (Use Case Diagram)', 'クラス図', 'コンポーネント図'],
    answer: 1,
    explain: '棒人間（アクター）と楕円（ユースケース）で構成されるのが「ユースケース図」。システムの機能要件を可視化します。'
  }
];

// ─── Game state ─────────────────────────────────────────────────────────────
var state = { idx: 0, score: 0, combo: 1, lives: 3, answered: false };

function restart() {
  state = { idx: 0, score: 0, combo: 1, lives: 3, answered: false };
  var els = ['stage-label','cat-badge-area','q-text','uml-area','choices','feedback','next-btn'];
  els.forEach(function(id) {
    var el = document.getElementById(id);
    el.style.display = '';
  });
  document.getElementById('result').classList.remove('show');
  render();
}

function render() {
  var q = questions[state.idx];
  var total = questions.length;

  document.getElementById('qnum').textContent = (state.idx+1) + '/' + total;
  document.getElementById('score').textContent = state.score;
  document.getElementById('combo').textContent = '×' + state.combo;
  document.getElementById('lives').textContent = state.lives > 0 ? ('♥ ').repeat(state.lives).trim() : '✕';
  document.getElementById('progress').style.width = ((state.idx / total) * 100) + '%';

  var catColors = { class: 'cat-class', seq: 'cat-seq', rel: 'cat-rel', diagram: 'cat-diagram' };
  document.getElementById('cat-badge-area').innerHTML =
    '<span class="cat-badge ' + catColors[q.cat] + '">' + q.catLabel + '</span>';
  document.getElementById('stage-label').textContent = '▶ Question ' + (state.idx + 1);
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('uml-area').innerHTML = q.svg;

  var choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  q.choices.forEach(function(c, i) {
    var btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = '[' + String.fromCharCode(65+i) + '] ' + c;
    btn.onclick = (function(idx) { return function() { answer(idx); }; })(i);
    choicesEl.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('next-btn').className = 'next-btn';
  state.answered = false;
}

function answer(choice) {
  if (state.answered) return;
  state.answered = true;
  var q = questions[state.idx];
  var btns = document.querySelectorAll('.choice-btn');
  btns.forEach(function(b) { b.disabled = true; });

  var correct = choice === q.answer;
  btns[choice].classList.add(correct ? 'correct' : 'wrong');
  if (!correct) btns[q.answer].classList.add('correct');

  var fb = document.getElementById('feedback');
  if (correct) {
    var gain = 100 * state.combo;
    state.score += gain;
    state.combo = Math.min(state.combo + 1, 5);
    document.getElementById('score').textContent = state.score;
    document.getElementById('combo').textContent = '×' + state.combo;
    fb.className = 'feedback ok show';
    fb.innerHTML = '✓ 正解！ +' + gain + 'pts<br><small>' + q.explain + '</small>';
  } else {
    state.combo = 1;
    state.lives = Math.max(0, state.lives - 1);
    document.getElementById('combo').textContent = '×' + state.combo;
    document.getElementById('lives').textContent = state.lives > 0 ? ('♥ ').repeat(state.lives).trim() : '✕';
    fb.className = 'feedback ng show';
    fb.innerHTML = '✗ 不正解。正解は [' + String.fromCharCode(65+q.answer) + ']<br><small>' + q.explain + '</small>';
  }

  var nextBtn = document.getElementById('next-btn');
  nextBtn.className = 'next-btn show';
  nextBtn.textContent = (state.idx + 1 >= questions.length) ? 'RESULT →' : 'NEXT →';
  nextBtn.onclick = function() {
    state.idx++;
    if (state.idx >= questions.length) showResult();
    else render();
  };
}

function showResult() {
  ['stage-label','cat-badge-area','q-text','uml-area','choices','feedback','next-btn'].forEach(function(id) {
    document.getElementById(id).style.display = 'none';
  });

  var rank, msg;
  if (state.score >= 900)      { rank = '⭐ RANK S'; msg = '完璧！UMLマスターの称号を授ける。設計の世界を支配せよ。'; }
  else if (state.score >= 650) { rank = '🥇 RANK A'; msg = '素晴らしい！UML力は本物だ。継続すれば伝説になれる。'; }
  else if (state.score >= 450) { rank = '🥈 RANK B'; msg = '上出来！基礎は固まっている。関係の種類をもう一度復習しよう。'; }
  else if (state.score >= 250) { rank = '🥉 RANK C'; msg = 'まだ伸びしろがある。矢印の意味を整理して再挑戦だ！'; }
  else                          { rank = '💀 RANK D'; msg = 'UMLの旅は始まったばかり。諦めずに挑み続けろ！'; }

  document.getElementById('result-rank').textContent = rank;
  document.getElementById('result-score').textContent = state.score + ' pts';
  document.getElementById('result-msg').innerHTML =
    msg + '<br><br>ライフ残: ' + (state.lives > 0 ? ('♥ ').repeat(state.lives).trim() : 'なし') +
    ' | 最大コンボ: ×' + state.combo;

  document.getElementById('result').classList.add('show');
}

render();
</script>
